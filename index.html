<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>名刺メール作成</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">myBridge CSV</p>
          <h1>名刺メール作成</h1>
        </div>
        <div class="topbar-actions">
          <label class="icon-button file-button" title="CSVを読み込む">
            <span aria-hidden="true">+</span>
            <input id="csvFile" type="file" accept=".csv,text/csv">
          </label>
          <button id="loadSampleButton" class="icon-button" type="button" title="サンプルを読み込む">S</button>
          <button id="exportButton" class="icon-button" type="button" title="CSVを書き出す">↓</button>
        </div>
      </header>

      <main class="workspace">
        <section class="left-pane" aria-label="名刺一覧">
          <div class="toolbar">
            <label class="search-box">
              <span aria-hidden="true">⌕</span>
              <input id="searchInput" type="search" placeholder="氏名・会社名・メモで検索">
            </label>
            <select id="categoryFilter" aria-label="分類で絞り込み">
              <option value="all">すべて</option>
              <option value="fuei">風営法</option>
              <option value="construction">建設業</option>
              <option value="subsidy">補助金</option>
              <option value="referral">連携</option>
              <option value="general">一般</option>
            </select>
          </div>

          <div class="summary-grid" aria-label="集計">
            <div class="metric">
              <span class="metric-label">総数</span>
              <strong id="totalCount">0</strong>
            </div>
            <div class="metric">
              <span class="metric-label">未処理</span>
              <strong id="pendingCount">0</strong>
            </div>
            <div class="metric">
              <span class="metric-label">作成済</span>
              <strong id="draftCount">0</strong>
            </div>
            <div class="metric">
              <span class="metric-label">対象外</span>
              <strong id="blockedCount">0</strong>
            </div>
          </div>

          <div id="contactList" class="contact-list" aria-live="polite"></div>
        </section>

        <section class="right-pane" aria-label="メール編集">
          <div id="emptyState" class="empty-state">
            <h2>CSVを読み込むと、ここに文面が出ます。</h2>
            <p>myBridgeから出したCSVをそのまま読み込めます。まずは右上の + か S を押してください。</p>
          </div>

          <article id="editorPanel" class="editor-panel" hidden>
            <div class="editor-header">
              <div>
                <p id="selectedCategory" class="category-pill">一般</p>
                <h2 id="selectedName">選択なし</h2>
                <p id="selectedMeta" class="selected-meta"></p>
              </div>
              <label class="toggle-row">
                <input id="excludeToggle" type="checkbox">
                <span>配信停止</span>
              </label>
            </div>

            <div class="field-grid">
              <label>
                <span>出会った場所</span>
                <input id="metAtInput" type="text" autocomplete="off">
              </label>
              <label>
                <span>紹介者</span>
                <input id="referrerInput" type="text" autocomplete="off">
              </label>
              <label>
                <span>見込み業務</span>
                <select id="serviceInput">
                  <option value="">自動判定</option>
                  <option value="風営法">風営法</option>
                  <option value="建設業許可">建設業許可</option>
                  <option value="補助金">補助金</option>
                  <option value="士業連携">士業連携</option>
                  <option value="一般挨拶">一般挨拶</option>
                </select>
              </label>
              <label>
                <span>ステータス</span>
                <select id="statusInput">
                  <option value="">未処理</option>
                  <option value="下書き作成済み">下書き作成済み</option>
                  <option value="送信済み">送信済み</option>
                  <option value="対象外">対象外</option>
                </select>
              </label>
            </div>

            <label class="memo-field">
              <span>メモ</span>
              <textarea id="memoInput" rows="3"></textarea>
            </label>

            <label class="mail-field">
              <span>件名</span>
              <input id="subjectInput" type="text">
            </label>
            <label class="mail-field">
              <span>本文</span>
              <textarea id="bodyInput" rows="16"></textarea>
            </label>

            <div class="action-row">
              <button id="regenerateButton" class="secondary-button" type="button">再生成</button>
              <button id="copyButton" class="secondary-button" type="button">コピー</button>
              <button id="gmailButton" class="primary-button" type="button">Gmailで開く</button>
            </div>
          </article>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
